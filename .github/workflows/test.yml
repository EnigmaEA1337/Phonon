name: Tests

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: stage
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        working-directory: stage
        run: ruff check .

      - name: Format check (ruff format)
        working-directory: stage
        run: ruff format --check .

      - name: Type check (mypy)
        working-directory: stage
        run: mypy src/

      - name: Tests + coverage
        working-directory: stage
        # 65 % gate covers pure-logic modules; subprocess/I/O wrappers are
        # excluded via [tool.coverage.run] omit in pyproject.toml and tested
        # at the hardware/integration level.
        run: pytest -v -m "not hardware" --cov-report=term-missing --cov-fail-under=65
