# Drop-in override installed by phonon-stage.
#
# The apt shairport-sync.service points at /usr/bin/shairport-sync,
# which is the apt binary — built WITHOUT --with-airplay-2. We want
# AirPlay 2 capability so we override ExecStart to point at our
# locally-built binary at /usr/local/bin/shairport-sync. The conf
# path also points at the phonon-managed location so the plugin's
# settings UI is the single source of truth.
#
# The empty `ExecStart=` line is mandatory in a systemd drop-in to
# clear the inherited command — without it the new ExecStart would
# be APPENDED, not REPLACED.

# `After=` belongs in [Unit], not [Service] — systemd silently
# ignores it in the wrong section ("Unknown key" warning in the
# journal). Express the runtime ordering on nqptp explicitly:
# this asks systemd to start nqptp first WHEN it's enabled, but
# doesn't make it a hard Requires= (AP1 mode wants nqptp stopped).
[Unit]
After=nqptp.service

[Service]
ExecStart=
ExecStart=/usr/local/bin/shairport-sync -c /var/lib/phonon/plugins/airplay-v1/shairport-sync.conf
