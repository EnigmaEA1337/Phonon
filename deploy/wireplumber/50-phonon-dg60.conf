# Phonon — WirePlumber rules for stable DG60 PipeWire node names.
#
# Deploy:
#   sudo cp 50-phonon-dg60.conf /etc/wireplumber/wireplumber.conf.d/
#   sudo -u phonon XDG_RUNTIME_DIR=/run/user/$(id -u phonon) \
#       systemctl --user restart wireplumber
#
# Why this exists:
# Avantree shipped every DG60 in this batch with the same hardcoded
# USB serial (ABCDEF0123456789). PipeWire builds its `node.name` from
# the serial, so two DG60s become:
#   alsa_output.usb-0a12_Avantree_DG60_ABCDEF0123456789-00.analog-stereo
#   alsa_output.usb-0a12_Avantree_DG60_ABCDEF0123456789-00.2.analog-stereo
# The `.2` is auto-suffixed and unstable — at every WirePlumber restart
# or USB hotplug, which DG60 gets the `.2` can flip. Routes that name
# one DG60 by full string silently target the wrong card.
#
# Fix:
# The companion udev rule (deploy/udev/99-phonon.rules) tags each card
# with `ATTR{id}=dg60a` / `dg60b` based on its USB port. PipeWire
# surfaces that as the `alsa.id` property. We match on that here and
# rewrite `node.name` to a stable string that doesn't depend on
# enumeration order.
#
# Only the `analog-stereo` profile is renamed — that's the one Phonon
# routes to. Other profiles (mono-fallback, pro-output, etc.) keep
# their long names; not worth the verbosity to rename every variant.

monitor.alsa.rules = [
  # DG60 #A — playback (sink)
  {
    matches = [
      {
        alsa.id = "dg60a"
        media.class = "Audio/Sink"
        device.profile.name = "analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_output.dg60a"
        node.description = "Avantree DG60 (port A)"
      }
    }
  }
  # DG60 #A — capture (source) — capture isn't used by Phonon today
  # but renaming it keeps the pair consistent and harmless.
  {
    matches = [
      {
        alsa.id = "dg60a"
        media.class = "Audio/Source"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.dg60a"
        node.description = "Avantree DG60 (port A, input)"
      }
    }
  }

  # DG60 #B — playback
  {
    matches = [
      {
        alsa.id = "dg60b"
        media.class = "Audio/Sink"
        device.profile.name = "analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_output.dg60b"
        node.description = "Avantree DG60 (port B)"
      }
    }
  }
  {
    matches = [
      {
        alsa.id = "dg60b"
        media.class = "Audio/Source"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.dg60b"
        node.description = "Avantree DG60 (port B, input)"
      }
    }
  }
]
