[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phonon-stage"
version = "0.1.0"
description = "Phonon Stage Agent — distributed audio router stage daemon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "zeroconf>=0.136,<1",
    "structlog>=24.4,<26",
    "pyyaml>=6.0,<7",
    "dbus-fast>=2.24,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "freezegun>=1.4,<2",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
phonon-stage = "phonon_stage.main:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/phonon_stage"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# I/O wrappers around dbus-fast / pactl / journalctl drown mypy strict in
# untyped-call noise. Skip them — they're tested at the integration level.
[[tool.mypy.overrides]]
module = [
  "phonon_stage.bluetooth.real",
  "phonon_stage.audio.real",
  "phonon_stage.discovery.real",
  "phonon_stage.pipewire.real",
  "phonon_stage.pipewire.cli",
  "phonon_stage.api.bluetooth",
  "phonon_stage.api.bluealsa_bridge",
  "phonon_stage.api.system",
  "phonon_stage.api.ws",
  "phonon_stage.api.levels",
  "phonon_stage.api.aes67",
  "phonon_stage.api.ptp",
  "phonon_stage.api.settings",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["hardware: requires physical hardware"]

[tool.coverage.run]
source = ["phonon_stage"]
# I/O-heavy modules are exclusively tested at the integration/hardware level
# (subprocess to pw-cli/bluetoothctl/systemctl, raw zeroconf, real ALSA, …).
# Including them in the gate would dilute the signal — they're 80% I/O glue.
omit = [
  "src/phonon_stage/audio/real.py",
  "src/phonon_stage/bluetooth/real.py",
  "src/phonon_stage/discovery/real.py",
  "src/phonon_stage/pipewire/real.py",
  "src/phonon_stage/api/system.py",
  "src/phonon_stage/api/ws.py",
  "src/phonon_stage/api/levels.py",
  "src/phonon_stage/api/bluetooth.py",
  "src/phonon_stage/api/bluealsa_bridge.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
