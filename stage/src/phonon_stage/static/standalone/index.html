<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phonon — Standalone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0a0f14; --bg-1: #121822; --bg-2: #1a2230; --bg-3: #243042;
  --border: #2a3850;
  --text: #f0f7fa; --text-mid: #b8cdd9; --text-dim: #8aa3b5; --text-fade: #6a8294;
  --cyan: #06b6d4; --green: #34d399; --pink: #e879f9; --red: #f87171;
  --yellow: #fbbf24; --purple: #a855f7; --blue: #1e40af;
  --t-source: #34d399; --t-output: #e879f9;
  --font-d: 'Barlow Condensed', sans-serif;
  --font-m: 'IBM Plex Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-d); background: var(--bg-0); color: var(--text); min-height: 100vh; }

/* ── Topbar ─────────────────────────────────────────── */
.topbar {
  height: 48px; background: linear-gradient(180deg, #1a2230, #121822);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px;
}
.tb-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: 1.5px; }
.tb-brand .logo { width: 24px; height: 24px; color: var(--cyan); }
.logo polygon, .logo path { stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.logo .atom { fill: currentColor; stroke: none; }
.logo .vertex { fill: currentColor; stroke: none; opacity: 0.55; }
.badge { background: linear-gradient(135deg, var(--cyan), #0e7490); color: var(--bg-0);
  padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
.tb-spacer { flex: 1; }
.tb-info { font-family: var(--font-m); font-size: 10px; color: var(--text-mid); }
.tb-led { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green); }
.tb-clock { font-family: var(--font-m); font-size: 12px; color: var(--text-dim); }

/* ── Layout ─────────────────────────────────────────── */
.container { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.section { background: var(--bg-1); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.section-head { padding: 10px 16px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.section-body { padding: 12px 16px; }

/* ── Cards grid ─────────────────────────────────────── */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.card-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.card-meta { font-family: var(--font-m); font-size: 9px; color: var(--text-dim); line-height: 1.6; }
.card-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; }
.tag-source { background: var(--t-source); color: var(--bg-0); }
.tag-sink { background: var(--t-output); color: var(--bg-0); }
.tag-both { background: var(--cyan); color: var(--bg-0); }

/* ── Patch Bay ──────────────────────────────────────── */
.patch-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
.patch-col { display: flex; flex-direction: column; gap: 6px; }
.patch-col-head { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 1px; padding-bottom: 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.patch-item { padding: 8px 10px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 5px;
  cursor: pointer; font-size: 11px; transition: border-color 0.15s, background 0.15s; }
.patch-item:hover { border-color: var(--cyan); background: var(--bg-3); }
.patch-item.selected { border-color: var(--cyan); background: rgba(6,182,212,0.12);
  box-shadow: 0 0 8px rgba(6,182,212,0.2); }
.patch-arrow { display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text-fade); padding-top: 28px; }
.patch-hint { font-size: 10px; color: var(--text-fade); text-align: center; padding: 8px; }

/* ── Mappings ───────────────────────────────────────── */
.mapping-row { display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid rgba(42,56,80,0.5); }
.mapping-row:last-child { border-bottom: none; }
.mapping-route { flex: 1; font-size: 11px; min-width: 0; }
.mapping-route span { color: var(--text-dim); }
.mapping-control { display: flex; align-items: center; gap: 8px; }
.gain-slider { width: 100px; accent-color: var(--cyan); }
.gain-val { font-family: var(--font-m); font-size: 9px; color: var(--text-mid); width: 44px; text-align: right; }
.btn-mute { width: 28px; height: 22px; border: 1px solid var(--border); background: var(--bg-2);
  color: var(--text-dim); font-size: 9px; font-weight: 700; border-radius: 3px; cursor: pointer; }
.btn-mute.active { background: var(--red); color: var(--bg-0); border-color: var(--red); }
.btn-del { width: 22px; height: 22px; border: 1px solid var(--border); background: var(--bg-2);
  color: var(--text-fade); font-size: 11px; border-radius: 3px; cursor: pointer; }
.btn-del:hover { border-color: var(--red); color: var(--red); }
.mapping-empty { color: var(--text-fade); font-size: 11px; text-align: center; padding: 16px; }

/* ── Bar Graph (shared: VU, CPU, RAM, USB) ─────────── */
.bar-graph, .vu-meter { display: flex; align-items: stretch; gap: 1px; height: 10px; width: 100%;
  background: #050a10; border: 1px solid #050a10; border-radius: 2px; padding: 1px; box-sizing: border-box; }
.bar-seg, .vu-seg { flex: 1; background: #0a141c; border-radius: 0.5px; min-width: 2px; }
.bar-label, .vu-label { font-family: var(--font-m); font-size: 8px; color: var(--text-fade); width: 14px; text-align: right; }

/* ── Bluetooth ──────────────────────────────────────── */
.bt-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.bt-device { flex: 1; font-size: 11px; }
.bt-status { font-family: var(--font-m); font-size: 9px; }
.btn { padding: 4px 10px; border: 1px solid var(--border); background: var(--bg-2);
  color: var(--text-mid); font-family: var(--font-d); font-size: 10px; border-radius: 4px;
  cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--bg-3); color: var(--text); }
.btn-primary { background: linear-gradient(135deg, var(--cyan), #0e7490); color: var(--bg-0);
  border-color: transparent; font-weight: 600; }
.btn-primary:hover { filter: brightness(1.1); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Stages ─────────────────────────────────────────── */
.stage-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 11px; }
.stage-led { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

/* ── Status bar ─────────────────────────────────────── */
.statusbar { display: flex; gap: 16px; font-family: var(--font-m); font-size: 9px; color: var(--text-dim);
  padding: 8px 16px; flex-wrap: wrap; }

/* ── Process pill ───────────────────────────────────── */
.proc-pill { display: flex; align-items: center; gap: 6px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: 11px; min-width: 140px; }
.proc-led { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.proc-led.on { background: var(--green); box-shadow: 0 0 4px var(--green); }
.proc-led.off { background: var(--red); box-shadow: 0 0 4px var(--red); }
.proc-name { font-weight: 600; }
.proc-ver { font-family: var(--font-m); font-size: 8px; color: var(--text-dim); }

/* ── Modal ──────────────────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
  display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg-1); border: 1px solid var(--border); border-radius: 10px;
  width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.modal-head { padding: 12px 16px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; border-radius: 10px 10px 0 0; }
.modal-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.modal-close { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
.modal-body { padding: 16px; font-size: 11px; line-height: 1.8; }
.modal-body dt { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; }
.modal-body dd { color: var(--text); margin-left: 0; font-family: var(--font-m); font-size: 10px; }
.sec-ok { color: var(--green); } .sec-warn { color: var(--yellow); } .sec-bad { color: var(--red); }

/* ── Strip / Channel Strip ──────────────────────────── */
.strip { width: 90px; background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px solid var(--border); border-radius: 6px; padding: 6px; display: flex;
  flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
.strip-name { font-size: 8px; font-weight: 600; text-align: center; line-height: 1.2;
  max-width: 80px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.strip-route { font-size: 7px; color: var(--text-dim); text-align: center; }

/* Knob */
.knob-wrap { position: relative; width: 40px; height: 40px; cursor: pointer; touch-action: none; }
.knob-svg { width: 100%; height: 100%; }
.knob-val { font-family: var(--font-m); font-size: 8px; color: var(--text-mid);
  text-align: center; margin-top: 1px; }

/* Vertical Fader */
.fader-area { display: flex; gap: 2px; align-items: flex-end; height: 160px; }
/* Ardour/console-style vertical meter */
.vu-bar { width: 8px; height: 100%; background: #020409; border-radius: 1px;
  display: flex; flex-direction: column-reverse; gap: 0; padding: 1px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.95); overflow: hidden; }
.vu-bar .vu-seg { width: 100%; flex: 1; background: #0a141c; min-height: 1px;
  transition: background 30ms linear; }
.fader-col { width: 22px; height: 100%; position: relative; cursor: pointer; touch-action: none; }
.fader-rail { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 3px; transform: translateX(-50%);
  background: linear-gradient(180deg, #050a10, #1a2230 50%, #050a10); border: 1px solid #050a10; border-radius: 1px; }
.fader-fill { position: absolute; left: 50%; transform: translateX(-50%); width: 4px; bottom: 4px;
  background: linear-gradient(180deg, var(--cyan) 0%, rgba(6,182,212,0.3) 100%); border-radius: 1px; }
.fader-handle { position: absolute; left: 50%; width: 20px; height: 10px; transform: translate(-50%, -50%);
  background: linear-gradient(180deg, #3a5078, #1a2230 50%, #060a10); border: 1px solid #050a10;
  border-top-color: #4a6088; border-radius: 2px; cursor: grab; z-index: 2; }
.fader-handle::before { content: ''; position: absolute; left: 3px; right: 3px; top: 50%; height: 1px;
  background: var(--text); transform: translateY(-50%); }
.fader-ticks { position: absolute; right: -18px; top: 4px; bottom: 4px; display: flex;
  flex-direction: column; justify-content: space-between; font-family: var(--font-m); font-size: 6px; color: var(--text-fade); }
.fader-ticks .unity { color: var(--cyan); font-weight: 700; }
.strip-db { font-family: var(--font-m); font-size: 9px; color: var(--text-mid); text-align: center; }

/* ── Mode Toggle (LIVE/EDIT) ────────────────────────── */
.mode-toggle { display: flex; background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 3px; overflow: hidden; }
.mode-btn { height: 26px; padding: 0 12px; background: transparent; border: none; color: var(--text-dim);
  font-family: var(--font-d); font-size: 11px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px; }
.mode-btn.active-live { background: linear-gradient(180deg, #22d3ee, #0e7490); color: var(--bg-0); }
.mode-btn.active-edit { background: linear-gradient(180deg, #e879f9, #9333ea); color: var(--bg-0); }

/* LIVE mode: visible but locked (no clicks) */
body.mode-live .edit-only { pointer-events: none; }
body.mode-live .edit-only * { pointer-events: none; }
body.mode-live .edit-only button,
body.mode-live .edit-only input,
body.mode-live .edit-only select { opacity: 0.4; }

/* ── Responsive ─────────────────────────────────────── */
@media (max-width: 640px) {
  .patch-grid { grid-template-columns: 1fr; }
  .patch-arrow { display: none; }
  .mapping-control { flex-wrap: wrap; }
  .gain-slider { width: 80px; }
}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="tb-brand">
    <svg class="logo" viewBox="0 0 100 100">
      <polygon points="50,10 86,30 86,70 50,90 14,70 14,30" stroke-width="3"/>
      <path d="M22 50 Q 32 38, 42 50 T 62 50 T 78 50" stroke-width="2.6"/>
      <circle class="atom" cx="50" cy="50" r="3.2"/>
      <circle class="vertex" cx="50" cy="10" r="2"/><circle class="vertex" cx="86" cy="30" r="2"/>
      <circle class="vertex" cx="86" cy="70" r="2"/><circle class="vertex" cx="50" cy="90" r="2"/>
      <circle class="vertex" cx="14" cy="70" r="2"/><circle class="vertex" cx="14" cy="30" r="2"/>
    </svg>
    PHONON
  </div>
  <span class="badge">STANDALONE</span>
  <div class="mode-toggle">
    <button class="mode-btn active-live" id="mode-live" onclick="setMode('live')">LIVE</button>
    <button class="mode-btn" id="mode-edit" onclick="setMode('edit')">EDIT</button>
  </div>
  <span class="tb-info" id="stage-id">—</span>
  <div class="tb-spacer"></div>
  <button class="btn edit-only" style="font-size:9px;padding:2px 6px" onclick="showModal('about')">About</button>
  <button class="btn edit-only" style="font-size:9px;padding:2px 6px" onclick="showModal('security')">Security</button>
  <span class="tb-led"></span>
  <span class="tb-info" id="uptime">—</span>
  <span class="tb-clock" id="clock">--:--:--</span>
</div>

<div class="container">

  <!-- System Processes -->
  <div class="section edit-only">
    <div class="section-head">System</div>
    <div class="section-body">
      <div id="sys-processes" style="display:flex;gap:10px;flex-wrap:wrap"></div>
    </div>
  </div>

  <!-- Capabilities -->
  <div class="section edit-only">
    <div class="section-head">Audio Devices</div>
    <div class="section-body">
      <div class="card-grid" id="audio-devices"></div>
    </div>
  </div>

  <!-- Patch Bay -->
  <div class="section edit-only">
    <div class="section-head">Patch Bay <span style="font-weight:400;color:var(--text-dim);font-size:10px">(max 8 mappings)</span></div>
    <div class="section-body">
      <div class="patch-grid">
        <div class="patch-col">
          <div class="patch-col-head">Sources (output ports)</div>
          <div id="patch-sources"></div>
        </div>
        <div class="patch-arrow">→</div>
        <div class="patch-col">
          <div class="patch-col-head">Sinks (input ports)</div>
          <div id="patch-sinks"></div>
        </div>
      </div>
      <div class="patch-hint" id="patch-hint">Select a source, then a sink to create a mapping</div>
    </div>
  </div>

  <!-- Active Mappings -->
  <div class="section">
    <div class="section-head">Active Mappings <span id="mapping-count" style="font-weight:400;color:var(--text-dim);font-size:10px"></span></div>
    <div class="section-body" id="mappings-list">
      <div class="mapping-empty">No active mappings</div>
    </div>
  </div>

  <!-- Bluetooth -->
  <div class="section edit-only">
    <div class="section-head">Bluetooth</div>
    <div class="section-body">
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
        <select id="bt-controller-select" onchange="btSelectController(this.value)"
          style="background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-family:var(--font-m);font-size:10px"></select>
        <button class="btn btn-primary" id="bt-power" onclick="btPower()">Power ON</button>
        <button class="btn" id="bt-scan" onclick="btScan()">Scan</button>
        <button class="btn" onclick="btSyncBridges()" title="Create PipeWire bridges for connected BT devices">Sync Inputs/Outputs</button>
        <span style="font-size:9px;color:var(--text-dim)">Buffer</span>
        <input type="range" min="20" max="200" step="10" value="50" id="bt-buffer-slider"
          style="width:60px;accent-color:var(--cyan)" oninput="document.getElementById('bt-buffer-val').textContent=this.value+'ms'">
        <span class="gain-val" id="bt-buffer-val">50ms</span>
        <span class="tb-info" id="bt-status">—</span>
      </div>
      <div id="bt-controllers-cards" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div>
      <div id="bt-paired"></div>
      <div id="bt-scan-results" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- Discovered Stages -->
  <div class="section edit-only">
    <div class="section-head">Network Stages</div>
    <div class="section-body" id="stages-list">
      <div style="color:var(--text-fade);font-size:11px">Scanning...</div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="statusbar" id="statusbar">
    <span id="status-ip">—</span>
    <span id="status-mode">—</span>
  </div>
</div>

<script>
const API = window.location.origin;
console.log('[Phonon] Script starting...');
window.onerror = function(msg, url, line, col, err) {
  document.getElementById('bt-status').textContent = 'JS ERROR: ' + msg + ' L' + line;
  console.error('[Phonon] Error:', msg, 'at line', line);
};

// ── Mode LIVE/EDIT (synced across all browsers via server) ──
function applyMode(mode) {
  document.body.className = mode === 'live' ? 'mode-live' : '';
  document.getElementById('mode-live').className = mode === 'live' ? 'mode-btn active-live' : 'mode-btn';
  document.getElementById('mode-edit').className = mode === 'edit' ? 'mode-btn active-edit' : 'mode-btn';
}
async function setMode(mode) {
  if (mode === 'edit') {
    // Confirmation modal — type "EDIT" to unlock
    let overlay = document.getElementById('edit-confirm-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'edit-confirm-overlay';
      overlay.className = 'modal-overlay open';
      overlay.innerHTML = `<div class="modal" style="max-width:360px">
        <div class="modal-head"><h2>Switch to EDIT mode</h2></div>
        <div class="modal-body" style="text-align:center">
          <p style="font-size:12px;color:var(--text-mid);margin-bottom:12px">This will unlock all controls.<br>Type <strong style="color:var(--pink)">EDIT</strong> to confirm.</p>
          <input type="text" id="edit-confirm-input" placeholder="Type EDIT..." autocomplete="off"
            style="background:var(--bg-0);border:1px solid var(--border);color:var(--text);font-family:var(--font-m);font-size:14px;padding:8px 12px;border-radius:4px;text-align:center;width:150px;text-transform:uppercase">
          <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
            <button class="btn" onclick="cancelEditMode()">Cancel</button>
            <button class="btn btn-primary" id="edit-confirm-btn" onclick="confirmEditMode()" disabled>Confirm</button>
          </div>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      const input = document.getElementById('edit-confirm-input');
      input.addEventListener('input', () => {
        document.getElementById('edit-confirm-btn').disabled = input.value.toUpperCase() !== 'EDIT';
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.toUpperCase() === 'EDIT') confirmEditMode();
        if (e.key === 'Escape') cancelEditMode();
      });
      input.focus();
    } else {
      overlay.classList.add('open');
      document.getElementById('edit-confirm-input').value = '';
      document.getElementById('edit-confirm-btn').disabled = true;
      document.getElementById('edit-confirm-input').focus();
    }
    return;
  }
  applyMode(mode);
  await api('/mode', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ mode }) });
}

async function confirmEditMode() {
  document.getElementById('edit-confirm-overlay').classList.remove('open');
  applyMode('edit');
  await api('/mode', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ mode: 'edit' }) });
}

function cancelEditMode() {
  document.getElementById('edit-confirm-overlay').classList.remove('open');
}
async function syncMode() {
  const r = await api('/mode');
  if (r) applyMode(r.mode);
}
syncMode();
setInterval(syncMode, 5000);
let state = {
  selectedSource: null, selectedSink: null, nodes: [], ports: [], mappings: [],
  btControllers: [], btSelectedController: null, pairedDevices: [], btAudioDevices: [],
};

// ── Clock ────────────────────────────────────────────
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8);
}, 1000);

// ── Fetch helpers ────────────────────────────────────
async function api(path, opts) {
  try {
    const r = await fetch(API + path, opts);
    if (!r.ok) throw new Error(r.statusText);
    if (r.status === 204) return null;
    return await r.json();
  } catch (e) { console.error('API error:', path, e); return null; }
}

// ── Refresh all ──────────────────────────────────────
async function refreshAll() {
  const [health, caps, nodes, ports, mappings, stages] = await Promise.all([
    api('/health'), api('/capabilities'), api('/pipewire/nodes'),
    api('/pipewire/ports'), api('/mappings'), api('/browse/stages?timeout=1'),
  ]);

  if (health) {
    document.getElementById('stage-id').textContent = health.stage_id;
    document.getElementById('uptime').textContent = `uptime ${Math.floor(health.uptime_seconds)}s`;
  }

  if (caps) {
    state.btControllers = caps.bluetooth_controllers || [];
    // Auto-select first controller if none selected
    if (!state.btSelectedController && state.btControllers.length) {
      state.btSelectedController = state.btControllers[0].address;
    }
    renderBtControllerSelect(state.btControllers);
    document.getElementById('status-ip').textContent = `IP: ${caps.stage_id}`;
    document.getElementById('status-mode').textContent = `Mode: ${caps.mode}`;
  }

  if (nodes) { state.nodes = nodes; renderPatchNodes(nodes, ports || []); renderAudioDevices(caps?.audio_devices || [], nodes); }
  if (ports) state.ports = ports;
  if (mappings) { state.mappings = mappings; renderMappings(mappings); }
  if (stages) renderStages(stages);

  // Fetch paired BT devices from ALL controllers, deduplicate by address
  if (state.btControllers.length) {
    const allPaired = [];
    const seenAddrs = new Set();
    for (const ctrl of state.btControllers) {
      const paired = await api(`/bluetooth/devices?controller_address=${ctrl.address}`);
      if (paired) {
        for (const d of paired) {
          if (seenAddrs.has(d.address)) continue;
          seenAddrs.add(d.address);
          d._controller = ctrl.address;
          allPaired.push(d);
        }
      }
    }
    state.pairedDevices = allPaired;

    // Fetch BlueALSA device info (codec, rate, channels)
    const btAudio = await api('/bluealsa/devices');
    if (btAudio) state.btAudioDevices = btAudio;

    renderBtPairedDevices(allPaired);
  }
}

// ── Render: Audio Devices ────────────────────────────
function renderAudioDevices(devices, nodes) {
  const el = document.getElementById('audio-devices');

  // ALSA devices
  const alsaCards = (devices || []).map(d => {
    const type = d.playback && d.capture ? 'both' : d.playback ? 'sink' : 'source';
    const tag = type === 'both' ? 'tag-both' : type === 'sink' ? 'tag-sink' : 'tag-source';
    const label = type === 'both' ? 'IN/OUT' : type === 'sink' ? 'OUTPUT' : 'INPUT';
    return `<div class="card">
      <div class="card-title">${d.name} <span class="card-tag ${tag}">${label}</span></div>
      <div class="card-meta">ID: ${d.id} · Driver: ${d.driver} · Card ${d.card_index}</div>
    </div>`;
  });

  // BT devices from PipeWire (bluez5 nodes), deduplicate by bt_address
  const seenBtAddr = new Set();
  const btNodes = (nodes || []).filter(n => {
    if (!n.bt_codec || !n.media_class) return false;
    if (seenBtAddr.has(n.bt_address)) return false;
    seenBtAddr.add(n.bt_address);
    return true;
  });
  // Check if same address has both sink and source nodes
  const btCards = btNodes.map(n => {
    const allForAddr = (nodes || []).filter(nn => nn.bt_address === n.bt_address);
    const hasSink = allForAddr.some(nn => nn.media_class.includes('Sink'));
    const hasSource = allForAddr.some(nn => nn.media_class.includes('Source'));
    const type = hasSink && hasSource ? 'both' : hasSink ? 'sink' : 'source';
    const tag = type === 'both' ? 'tag-both' : type === 'sink' ? 'tag-sink' : 'tag-source';
    const label = type === 'both' ? 'IN/OUT' : type === 'sink' ? 'OUTPUT' : 'INPUT';
    const codec = n.bt_codec.toUpperCase();
    const sr = n.sample_rate ? `${n.sample_rate / 1000}kHz` : '';
    const lat = n.latency_ms ? `${n.latency_ms}ms` : '';
    const meta = [codec, sr, `${n.channels}ch`, lat, n.bt_address].filter(Boolean).join(' · ');
    return `<div class="card" style="border-left:3px solid var(--cyan)">
      <div class="card-title">${n.nick || n.name} <span class="card-tag ${tag}">${label}</span> <span style="font-size:8px;color:var(--cyan)">BT</span></div>
      <div class="card-meta">${meta}</div>
    </div>`;
  });

  const all = [...alsaCards, ...btCards];
  if (!all.length) { el.innerHTML = '<div style="color:var(--text-fade);font-size:11px">No devices detected</div>'; return; }
  el.innerHTML = all.join('');
}

// ── Render: Patch Bay ────────────────────────────────
function nodeInfoBadge(n) {
  if (!n.bt_codec) return '';
  const parts = [n.bt_codec.toUpperCase()];
  if (n.latency_ms) parts.push(n.latency_ms + 'ms');
  if (n.sample_rate) parts.push((n.sample_rate/1000) + 'kHz');
  return `<div style="font-family:var(--font-m);font-size:8px;color:var(--cyan);margin-top:2px">${parts.join(' · ')}</div>`;
}

function renderPatchNodes(nodes, ports) {
  // BT-In null sinks (phone capture) should appear as sources, not sinks
  const isBtInput = (n) => n.nick?.includes('-BT-In') || n.name?.includes('_in');
  const sources = nodes.filter(n => n.media_class.includes('Source') || n.media_class.includes('Duplex') || (n.media_class.includes('Sink') && isBtInput(n)));
  const sinks = nodes.filter(n => (n.media_class.includes('Sink') || n.media_class.includes('Duplex')) && !isBtInput(n));

  const srcEl = document.getElementById('patch-sources');
  srcEl.innerHTML = sources.length ? sources.map(n =>
    `<div class="patch-item${state.selectedSource?.id === n.id ? ' selected' : ''}"
      onclick="selectSource(${n.id})" title="${n.media_class}">
      ${n.nick || n.name} <span style="color:var(--text-fade);font-size:9px">#${n.id}</span>
      ${nodeInfoBadge(n)}
    </div>`
  ).join('') : '<div style="color:var(--text-fade);font-size:10px">No sources</div>';

  const sinkEl = document.getElementById('patch-sinks');
  sinkEl.innerHTML = sinks.length ? sinks.map(n =>
    `<div class="patch-item${state.selectedSink?.id === n.id ? ' selected' : ''}"
      onclick="selectSink(${n.id})" title="${n.media_class}">
      ${n.nick || n.name} <span style="color:var(--text-fade);font-size:9px">#${n.id}</span>
      ${nodeInfoBadge(n)}
    </div>`
  ).join('') : '<div style="color:var(--text-fade);font-size:10px">No sinks</div>';
}

function selectSource(nodeId) {
  state.selectedSource = state.nodes.find(n => n.id === nodeId) || null;
  state.selectedSink = null;
  document.getElementById('patch-hint').textContent = `Source: ${state.selectedSource?.nick || state.selectedSource?.name}. Now select a sink.`;
  renderPatchNodes(state.nodes, state.ports);
}

function selectSink(nodeId) {
  if (!state.selectedSource) {
    document.getElementById('patch-hint').textContent = 'Select a source first!';
    return;
  }
  state.selectedSink = state.nodes.find(n => n.id === nodeId) || null;
  renderPatchNodes(state.nodes, state.ports);
  createMapping();
}

async function createMapping() {
  if (!state.selectedSource || !state.selectedSink) return;
  if (state.mappings.length >= 8) {
    document.getElementById('patch-hint').textContent = 'Maximum 8 mappings reached!';
    return;
  }

  const srcPorts = state.ports.filter(p => p.node_id === state.selectedSource.id && p.direction === 'output');
  const sinkPorts = state.ports.filter(p => p.node_id === state.selectedSink.id && p.direction === 'input');

  if (!srcPorts.length || !sinkPorts.length) {
    document.getElementById('patch-hint').textContent = 'No compatible ports found!';
    return;
  }

  await api('/mappings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      source_node_id: state.selectedSource.id,
      source_port_ids: srcPorts.map(p => p.id),
      sink_node_id: state.selectedSink.id,
      sink_port_ids: sinkPorts.map(p => p.id),
      gain_db: 0, pan: 0, mute: false,
    }),
  });

  state.selectedSource = null;
  state.selectedSink = null;
  document.getElementById('patch-hint').textContent = 'Mapping created! Select source then sink for another.';
  await refreshAll();
}

// ── Render: Mappings ─────────────────────────────────
function renderMappings(mappings) {
  const el = document.getElementById('mappings-list');
  document.getElementById('mapping-count').textContent = `(${mappings.length}/8)`;

  if (!mappings.length) { el.innerHTML = '<div class="mapping-empty">No active mappings</div>'; return; }

  // VU segments for vertical bars (20 segments)
  const vuSegs = Array.from({length: 20}, () => '<div class="vu-seg"></div>').join('');
  // Fader position: map dB (-90..+12) to % (100..0)
  const dbToY = (db) => faderDbToY(db);
  // Knob angle: map 0-50ms to 0-270 degrees
  const delayToAngle = (ms) => Math.min(ms / 50, 1) * 270;

  el.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">' +
    mappings.map(m => {
    const srcNode = state.nodes.find(n => n.id === m.source_node_id);
    const sinkNode = state.nodes.find(n => n.id === m.sink_node_id);
    const srcName = srcNode?.nick || srcNode?.name || `#${m.source_node_id}`;
    const sinkName = sinkNode?.nick || sinkNode?.name || `#${m.sink_node_id}`;
    const hasLinks = !m.mute && m.link_ids?.length > 0;
    const ledColor = hasLinks ? 'var(--green)' : m.mute ? 'var(--red)' : 'var(--text-fade)';
    const delayVal = (m.delay_ms || 0).toFixed(1);
    const faderY = dbToY(m.gain_db);
    const knobAngle = delayToAngle(m.delay_ms || 0);

    // SVG knob
    const knobR = 15, knobCx = 20, knobCy = 20;
    const startAngle = 135, endAngle = startAngle + knobAngle;
    const toRad = a => (a - 90) * Math.PI / 180;
    const arcEnd = { x: knobCx + knobR * Math.cos(toRad(endAngle)), y: knobCy + knobR * Math.sin(toRad(endAngle)) };
    const largeArc = knobAngle > 180 ? 1 : 0;
    const arcStart = { x: knobCx + knobR * Math.cos(toRad(startAngle)), y: knobCy + knobR * Math.sin(toRad(startAngle)) };
    const knobPath = knobAngle > 0.5 ? `M${arcStart.x},${arcStart.y} A${knobR},${knobR} 0 ${largeArc} 1 ${arcEnd.x},${arcEnd.y}` : '';
    // Indicator dot
    const dotAngle = toRad(endAngle);
    const dotX = knobCx + (knobR - 4) * Math.cos(dotAngle);
    const dotY = knobCy + (knobR - 4) * Math.sin(dotAngle);

    return `<div class="strip" data-mapping-id="${m.id}" data-active="${hasLinks}" data-gain="${m.gain_db}">
      <!-- Header -->
      <div style="display:flex;align-items:center;gap:3px;width:100%">
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${ledColor};flex-shrink:0"></span>
        <button class="btn-mute${m.mute ? ' active' : ''}" onclick="toggleMute('${m.id}', ${!m.mute})" style="width:18px;height:14px;font-size:7px">M</button>
        <button class="btn-del edit-only" onclick="deleteMapping('${m.id}')" style="width:14px;height:14px;font-size:8px">✕</button>
      </div>
      <div class="strip-name" title="${srcName} → ${sinkName}">${srcName}</div>
      <div class="strip-route">→ ${sinkName}</div>

      <!-- Delay Knob -->
      <div class="knob-wrap" data-mapping="${m.id}" data-param="delay" data-value="${delayVal}">
        <svg class="knob-svg" viewBox="0 0 40 40">
          <circle cx="${knobCx}" cy="${knobCy}" r="${knobR}" fill="none" stroke="#1a2230" stroke-width="3"/>
          ${knobPath ? `<path d="${knobPath}" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round"/>` : ''}
          <circle cx="${knobCx}" cy="${knobCy}" r="8" fill="#1a2230" stroke="#2a3850" stroke-width="1"/>
          <circle cx="${dotX}" cy="${dotY}" r="2" fill="var(--text)"/>
        </svg>
      </div>
      <div class="knob-val" id="dv-${m.id}">${delayVal}ms</div>

      <!-- VU L + VU R + Fader + ticks -->
      <div class="fader-area">
        <div style="display:flex;flex-direction:column;justify-content:space-between;height:100%;font-family:var(--font-m);font-size:5px;color:var(--text-fade);text-align:right;padding:2px 0">
          <span>0</span><span>-6</span><span>-12</span><span>-20</span><span>-40</span><span>-60</span>
        </div>
        <div class="vu-bar" data-ch="L">${vuSegs}</div>
        <div class="vu-bar" data-ch="R">${vuSegs}</div>
        <div class="fader-col" data-mapping="${m.id}" data-param="gain">
          <div class="fader-rail"></div>
          <div class="fader-fill" style="top:${faderY}%"></div>
          <div class="fader-handle" style="top:${faderY}%"></div>
        </div>
        <div class="fader-ticks">
          <span>+12</span><span>+6</span><span class="unity">0</span><span>-6</span>
          <span>-10</span><span>-20</span><span>-40</span><span>-∞</span>
        </div>
      </div>
      <div class="strip-db" id="gv-${m.id}">${m.gain_db.toFixed(1)} dB</div>
    </div>`;
  }).join('') + '</div>';

  // Setup fader drag handlers
  el.querySelectorAll('.fader-col').forEach(setupFaderDrag);
  el.querySelectorAll('.knob-wrap').forEach(setupKnobDrag);
}

// Audio-curve fader mapping: top 70% = +12 to -40dB, bottom 30% = -40 to -90dB
function faderYToDb(pct) {
  if (pct <= 70) return 12 - (pct / 70) * 52;  // +12 to -40
  return -40 - ((pct - 70) / 30) * 50;          // -40 to -90
}
function faderDbToY(db) {
  if (db >= -40) return Math.max(0, Math.min(70, (12 - db) / 52 * 70));
  return Math.min(100, 70 + (-40 - db) / 50 * 30);
}

function setupFaderDrag(faderEl) {
  const mid = faderEl.dataset.mapping;
  let dragging = false, startY = 0, startVal = 0;
  const handle = faderEl.querySelector('.fader-handle');
  const fill = faderEl.querySelector('.fader-fill');

  const onDown = (e) => {
    dragging = true;
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    startVal = parseFloat(handle.style.top) || 50;
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const rect = faderEl.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, startVal + ((y - startY) / rect.height) * 100));
    handle.style.top = pct + '%';
    fill.style.top = pct + '%';
    const db = faderYToDb(pct);
    const dbEl = document.getElementById('gv-' + mid);
    if (dbEl) dbEl.textContent = db.toFixed(1) + ' dB';
    updateGain(mid, db.toFixed(1));
    e.preventDefault();
  };
  const onUp = () => { dragging = false; };

  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive: false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive: false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
}

function setupKnobDrag(knobEl) {
  const mid = knobEl.dataset.mapping;
  let dragging = false, startY = 0, startVal = 0;

  const onDown = (e) => {
    dragging = true;
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    startVal = parseFloat(knobEl.dataset.value) || 0;
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const delta = (startY - y) * 0.3;
    const val = Math.max(0, Math.min(50, startVal + delta));
    knobEl.dataset.value = val.toFixed(1);
    const dvEl = document.getElementById('dv-' + mid);
    if (dvEl) dvEl.textContent = val.toFixed(1) + 'ms';
    updateDelay(mid, val.toFixed(1));
    e.preventDefault();
  };
  const onUp = () => { dragging = false; };

  knobEl.addEventListener('mousedown', onDown);
  knobEl.addEventListener('touchstart', onDown, {passive: false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive: false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
}

let gainTimeout = {};
function updateGain(id, val) {
  document.getElementById('gv-' + id).textContent = parseFloat(val).toFixed(1) + ' dB';
  clearTimeout(gainTimeout[id]);
  gainTimeout[id] = setTimeout(() => {
    api('/mappings/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ gain_db: parseFloat(val) }) });
  }, 200);
}

let delayTimeout = {};
function updateDelay(id, val) {
  document.getElementById('dv-' + id).textContent = parseFloat(val).toFixed(1) + ' ms';
  clearTimeout(delayTimeout[id]);
  delayTimeout[id] = setTimeout(() => {
    api('/mappings/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ delay_ms: parseFloat(val) }) });
  }, 200);
}

async function toggleMute(id, mute) {
  await api('/mappings/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ mute }) });
  await refreshAll();
}

async function deleteMapping(id) {
  await api('/mappings/' + id, { method: 'DELETE' });
  await refreshAll();
}

// ── Bluetooth ────────────────────────────────────────
function renderBtControllerSelect(controllers) {
  const sel = document.getElementById('bt-controller-select');
  const current = state.btSelectedController;
  sel.innerHTML = controllers.map(c => {
    const selected = c.address === current ? ' selected' : '';
    const pw = c.powered ? ' ON' : ' OFF';
    const hw = c.hw_name ? ` [${c.hw_name}]` : '';
    return `<option value="${c.address}"${selected}>${c.alias || c.name}${hw} (${c.address})${pw}</option>`;
  }).join('');
  if (!controllers.length) sel.innerHTML = '<option>No controllers</option>';

  // Update power button text based on selected controller
  const ctrl = controllers.find(c => c.address === current);
  if (ctrl) {
    document.getElementById('bt-power').textContent = ctrl.powered ? 'Power OFF' : 'Power ON';
  }

  // Render controller cards with role toggle
  const cardsEl = document.getElementById('bt-controllers-cards');
  cardsEl.innerHTML = controllers.map(c => {
    const role = c.discoverable ? 'receiver' : 'transmitter';
    const roleColor = role === 'receiver' ? 'var(--green)' : 'var(--pink)';
    const roleLabel = role === 'receiver' ? 'RX' : 'TX';
    const hw = c.hw_name ? c.hw_name.split(',')[0] : '';
    const pwLed = c.powered ? 'background:var(--green);box-shadow:0 0 4px var(--green)' : 'background:var(--text-fade)';
    return `<div class="card" style="min-width:220px;padding:8px 10px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;${pwLed}"></span>
        <input type="text" value="${c.alias || c.name}" style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:11px;font-weight:600;font-family:var(--font-d);width:100px;padding:0 2px"
          onchange="btSetAlias('${c.address}',this.value)">
        <span style="font-family:var(--font-m);font-size:8px;color:${roleColor};font-weight:700;border:1px solid ${roleColor};padding:0 4px;border-radius:2px">${roleLabel}</span>
      </div>
      <div class="card-meta">${hw}</div>
      <div class="card-meta">${c.address}</div>
      <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">
        <button class="btn${role === 'receiver' ? ' btn-primary' : ''}" style="font-size:8px;padding:2px 6px"
          onclick="btSetRole('${c.address}','receiver')">Receiver</button>
        <button class="btn${role === 'transmitter' ? ' btn-primary' : ''}" style="font-size:8px;padding:2px 6px"
          onclick="btSetRole('${c.address}','transmitter')">Transmitter</button>
        ${role === 'receiver' ? `<button class="btn" style="font-size:8px;padding:2px 6px;${c.pairable ? 'background:var(--green);color:var(--bg-0);border-color:var(--green)' : ''}"
          onclick="btOpenPairing('${c.address}')" id="pair-btn-${c.address}">${c.pairable ? 'Pairing ouvert...' : 'Ouvrir appairage'}</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function btOpenPairing(addr) {
  const duration = 60;
  await api(`/bluetooth/${addr}/pairing`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ duration }),
  });
  document.getElementById('bt-status').textContent = `Pairing ouvert ${duration}s...`;
  // Countdown in button
  const btn = document.getElementById('pair-btn-' + addr);
  if (btn) {
    let remaining = duration;
    btn.textContent = `Pairing ${remaining}s`;
    btn.style.background = 'var(--green)';
    btn.style.color = 'var(--bg-0)';
    const timer = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timer);
        btn.textContent = 'Ouvrir appairage';
        btn.style.background = '';
        btn.style.color = '';
        document.getElementById('bt-status').textContent = 'Pairing fermé';
        refreshAll();
      } else {
        btn.textContent = `Pairing ${remaining}s`;
      }
    }, 1000);
  }
}

async function btSetAlias(addr, alias) {
  await api(`/bluetooth/${addr}/alias`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ alias }),
  });
  await refreshAll();
}

async function btSetRole(addr, role) {
  await api(`/bluetooth/${addr}/role`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ role }),
  });
  await refreshAll();
}

function btSelectController(addr) {
  state.btSelectedController = addr;
  document.getElementById('bt-scan-results').innerHTML = '';
  refreshAll();
}

async function btPower() {
  if (!state.btSelectedController) return;
  const btn = document.getElementById('bt-power');
  const isPowered = btn.textContent.includes('OFF');
  btn.disabled = true;
  document.getElementById('bt-status').textContent = isPowered ? 'Powering off...' : 'Powering on...';
  await api(`/bluetooth/${state.btSelectedController}/power`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ powered: !isPowered }),
  });
  btn.disabled = false;
  await refreshAll();
}

async function btScan() {
  if (!state.btSelectedController) return;
  const btn = document.getElementById('bt-scan');
  btn.disabled = true; btn.textContent = 'Scanning...';
  document.getElementById('bt-status').textContent = 'Scanning (10s)...';

  const devices = await api(`/bluetooth/scan?controller_address=${state.btSelectedController}&timeout=10`);
  btn.disabled = false; btn.textContent = 'Scan';

  if (devices) {
    const pairedAddrs = new Set((state.pairedDevices || []).map(d => d.address));
    const newDevices = devices.filter(d => !pairedAddrs.has(d.address));
    document.getElementById('bt-status').textContent = `Found ${newDevices.length} new devices`;
    renderBtScanResults(newDevices);
  }
}

function renderBtPairedDevices(devices) {
  const el = document.getElementById('bt-paired');
  if (!devices?.length) {
    el.innerHTML = '<div style="color:var(--text-fade);font-size:11px">No paired devices</div>';
    return;
  }
  el.innerHTML = '<div style="font-size:10px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">Paired devices</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    devices.map(d => {
      const led = d.connected ? 'background:var(--green);box-shadow:0 0 6px var(--green)' : 'background:var(--text-fade)';
      const status = d.connected ? 'connected' : 'paired';
      const statusColor = d.connected ? 'var(--green)' : 'var(--yellow)';
      const actions = d.connected
        ? `<button class="btn" onclick="btDisconnect('${d.address}')" style="font-size:8px;padding:2px 6px">Disconnect</button>`
        : `<button class="btn btn-primary" onclick="btConnect('${d.address}')" style="font-size:8px;padding:2px 6px">Connect</button>`;

      // Match BlueALSA device info for codec/rate
      const baDevice = (state.btAudioDevices || []).find(bd => bd.mac === d.address);
      let infoHtml = '';
      if (baDevice && d.connected) {
        const parts = [];
        if (baDevice.codec) parts.push(`<span style="color:var(--cyan);font-weight:600">${baDevice.codec}</span>`);
        if (baDevice.rate) parts.push(`${(parseInt(baDevice.rate) / 1000).toFixed(1)}kHz`);
        if (baDevice.channels) parts.push(`${baDevice.channels}ch`);
        if (baDevice.type) parts.push(baDevice.type === 'playback' ? 'OUTPUT' : 'INPUT');
        if (parts.length) infoHtml += `<div class="card-meta">${parts.join(' · ')}</div>`;
        if (baDevice.total_latency_ms) {
          const lat = parseInt(baDevice.total_latency_ms);
          const color = lat > 200 ? 'var(--yellow)' : lat > 100 ? 'var(--text-mid)' : 'var(--green)';
          infoHtml += `<div class="card-meta"><span style="color:${color}">${lat}ms</span> <span style="color:var(--text-fade)">(codec ${baDevice.codec_latency_ms} + buf ${baDevice.bridge_buffer_ms})</span></div>`;
        }
      }

      return `<div class="card" style="min-width:200px;padding:8px 10px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;${led}"></span>
          <span style="font-size:11px;font-weight:600">${d.alias || d.name}</span>
          <span style="font-size:8px;color:${statusColor};font-weight:600;border:1px solid ${statusColor};padding:0 4px;border-radius:2px">${status}</span>
        </div>
        ${infoHtml}
        <div class="card-meta">${d._controller || '?'} → ${d.address}</div>
        <div style="margin-top:6px;display:flex;gap:4px">
          ${actions}
          <button class="btn-del" title="Unpair" onclick="btUnpair('${d.address}')" style="font-size:9px">✕</button>
        </div>
      </div>`;
    }).join('') + '</div>';
}

function renderBtScanResults(devices) {
  const el = document.getElementById('bt-scan-results');
  if (!devices?.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div style="font-size:10px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">Discovered devices</div>' +
    devices.map(d => `<div class="bt-row">
      <div class="bt-device">${d.alias || d.name || d.address}</div>
      <span style="font-family:var(--font-m);font-size:9px;color:var(--text-dim)">${d.address}</span>
      <button class="btn btn-primary" onclick="btQuickPair('${d.address}')" id="qp-${d.address.replace(/:/g,'')}">Quick Pair</button>
    </div>`).join('');
}

async function btQuickPair(addr) {
  const btn = document.getElementById('qp-' + addr.replace(/:/g,''));
  if (btn) { btn.disabled = true; btn.textContent = 'Pairing...'; }
  document.getElementById('bt-status').textContent = 'Quick Pair: scanning + pairing + connecting...';
  const result = await api(`/bluetooth/quick-pair?controller_address=${state.btSelectedController}`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_address:addr})
  });
  if (result?.connected) {
    document.getElementById('bt-status').textContent = 'Connected!';
  } else if (result?.paired) {
    document.getElementById('bt-status').textContent = 'Paired but not connected — try Sync Inputs/Outputs';
  } else {
    document.getElementById('bt-status').textContent = result?.status === 'not_found' ? 'Device not found — put it in pairing mode' : 'Pair failed: ' + JSON.stringify(result);
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Quick Pair'; }
  await refreshAll();
}
async function btConnect(addr) {
  document.getElementById('bt-status').textContent = 'Connecting...';
  await api('/bluetooth/connect', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_address:addr})});
  await refreshAll();
}
async function btDisconnect(addr) {
  document.getElementById('bt-status').textContent = 'Disconnecting...';
  await api('/bluetooth/disconnect', { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_address:addr})});
  await refreshAll();
}
async function btUnpair(addr) {
  if (!confirm('Remove pairing for ' + addr + '?')) return;
  document.getElementById('bt-status').textContent = 'Unpairing...';
  await api('/bluetooth/unpair', { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_address:addr})});
  await api('/bluealsa/sync', { method: 'POST' });
  await refreshAll();
}
async function btSyncBridges() {
  const buf = document.getElementById('bt-buffer-slider').value;
  document.getElementById('bt-status').textContent = `Syncing (buffer=${buf}ms)...`;
  const result = await api(`/bluealsa/sync?buffer_ms=${buf}`, { method: 'POST' });
  document.getElementById('bt-status').textContent = result ? `${result.active} bridge(s) active` : 'Sync failed';
  await refreshAll();
}

// ── Stages ───────────────────────────────────────────
function renderStages(stages) {
  const el = document.getElementById('stages-list');
  if (!stages?.length) { el.innerHTML = '<div style="color:var(--text-fade);font-size:11px">No other Stages on network</div>'; return; }
  el.innerHTML = stages.map(s => `<div class="stage-item">
    <span class="stage-led"></span>
    <span>${s.stage_id}</span>
    <span style="color:var(--text-dim)">${s.host}:${s.port}</span>
    <span class="badge" style="font-size:8px">${s.mode}</span>
  </div>`).join('');
}

// ── VU Meter — real levels from /levels endpoint ─────
let vuLevels = {};

async function fetchLevels() {
  try {
    const data = await api('/levels');
    if (data) vuLevels = data;
  } catch(e) { /* ignore */ }
}
setInterval(fetchLevels, 300);

// Peak hold state per bar
const peakHolds = new WeakMap();

function animateVU() {
  try {
    // Get max level from all bridges
    let maxLevel = 0;
    for (const val of Object.values(vuLevels)) {
      if (val > maxLevel) maxLevel = val;
    }
    if (maxLevel > 0.01) maxLevel = Math.min(1.0, maxLevel + (Math.random() - 0.5) * 0.03);

    // Console-style colors (Ardour/PreSonus inspired)
    const segColor = (pos) => {
      if (pos >= 0.95) return '#ff4444';                    // clip red
      if (pos >= 0.85) return '#f87171';                    // hot red
      if (pos >= 0.7) return '#fbbf24';                     // yellow
      if (pos >= 0.5) return '#86efac';                     // bright green
      return '#34d399';                                     // green
    };
    const segGlow = (pos) => {
      if (pos >= 0.85) return 'inset 0 0 2px rgba(248,113,113,0.4)';
      if (pos >= 0.7) return 'inset 0 0 1px rgba(251,191,36,0.3)';
      return 'inset 0 0 1px rgba(52,211,153,0.15)';
    };

    // Apply to vertical VU bars (column-reverse = bottom first)
    document.querySelectorAll('.vu-bar').forEach(bar => {
      const segs = bar.children;
      const total = segs.length;
      if (!total) return;

      // Peak hold
      let peak = peakHolds.get(bar) || { val: 0, decay: 0 };
      if (maxLevel > peak.val) { peak.val = maxLevel; peak.decay = 8; }
      else if (peak.decay > 0) { peak.decay--; }
      else { peak.val = Math.max(0, peak.val - 0.03); }
      peakHolds.set(bar, peak);

      const lit = Math.floor(maxLevel * total);
      const peakSeg = Math.floor(peak.val * total);

      for (let i = 0; i < total; i++) {
        if (i < lit) {
          const pos = i / total;
          segs[i].style.background = segColor(pos);
          segs[i].style.boxShadow = segGlow(pos);
        } else if (i === peakSeg && peakSeg > 0) {
          // Peak hold indicator — bright cyan
          segs[i].style.background = '#67e8f9';
          segs[i].style.boxShadow = '0 0 3px #67e8f9';
        } else {
          segs[i].style.background = '#0a141c';
          segs[i].style.boxShadow = 'none';
        }
      }
    });
  } catch(e) { /* ignore */ }
}
setInterval(animateVU, 100);

// ── Init ─────────────────────────────────────────────
refreshAll();
setInterval(refreshAll, 10000);

// ── System Status ────────────────────────────────────
function segBar(pct, segs, color) {
  // Audio-style segmented bar graph
  const total = segs || 16;
  const lit = Math.floor(pct / 100 * total);
  let html = '<div class="bar-graph">';
  for (let i = 0; i < total; i++) {
    let bg = '#0a141c';
    if (i < lit) {
      if (i >= total * 0.9) bg = '#f87171';
      else if (i >= total * 0.7) bg = '#fbbf24';
      else bg = color || '#06b6d4';
    }
    html += `<div class="bar-seg" style="background:${bg}"></div>`;
  }
  return html + '</div>';
}

async function refreshSystemStatus() {
  const sys = await api('/system/status');
  if (!sys) return;
  const el = document.getElementById('sys-processes');

  // Process pills
  let html = sys.processes.map(p => {
    const led = p.running ? 'on' : 'off';
    const ver = p.version ? `<span class="proc-ver">${p.version}</span>` : '';
    return `<div class="proc-pill"><span class="proc-led ${led}"></span><span class="proc-name">${p.name}</span>${ver}</div>`;
  }).join('');

  // CPU gauge
  html += `<div class="proc-pill" style="min-width:160px;flex-direction:column;align-items:stretch;gap:3px">
    <div style="display:flex;justify-content:space-between;font-size:9px">
      <span>CPU</span><span style="font-family:var(--font-m)">${sys.cpu_percent}%</span>
    </div>
    ${segBar(sys.cpu_percent, 16, '#06b6d4')}
    <span class="proc-ver">load: ${sys.cpu_load_1m.toFixed(1)} / ${sys.cpu_load_5m.toFixed(1)} / ${sys.cpu_load_15m.toFixed(1)}</span>
  </div>`;

  // Memory gauge
  html += `<div class="proc-pill" style="min-width:160px;flex-direction:column;align-items:stretch;gap:3px">
    <div style="display:flex;justify-content:space-between;font-size:9px">
      <span>Memory</span><span style="font-family:var(--font-m)">${sys.memory_percent}%</span>
    </div>
    ${segBar(sys.memory_percent, 16, '#34d399')}
    <span class="proc-ver">${sys.memory_used_mb}/${sys.memory_total_mb} MB</span>
  </div>`;

  // USB buses
  if (sys.usb_buses?.length) {
    html += sys.usb_buses.map(b => {
      const load = Math.min(b.device_count / 8 * 100, 100);
      const spd = b.speed_mbps ? `${b.speed_mbps}M` : '';
      return `<div class="proc-pill" style="min-width:140px;flex-direction:column;align-items:stretch;gap:3px">
        <div style="display:flex;justify-content:space-between;font-size:9px">
          <span>${b.bus} ${spd}</span><span style="font-family:var(--font-m)">${b.device_count} dev</span>
        </div>
        ${segBar(load, 12, '#a855f7')}
        <span class="proc-ver">${b.devices.slice(0,3).map(d => d.split(' ').slice(0,3).join(' ')).join(', ')}</span>
      </div>`;
    }).join('');
  }

  el.innerHTML = html;
}
refreshSystemStatus();
setInterval(refreshSystemStatus, 30000);

// Auto-sync bluealsa bridges every 30s (restart dead bridges after pause/resume)
setInterval(async () => {
  const buf = document.getElementById('bt-buffer-slider')?.value || 50;
  await api(`/bluealsa/sync?buffer_ms=${buf}`, { method: 'POST' });
}, 30000);

// ── Modals ───────────────────────────────────────────
async function showModal(type) {
  let overlay = document.getElementById('modal-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay';
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('open'); };
    overlay.innerHTML = '<div class="modal"><div class="modal-head"><h2 id="modal-title"></h2><button class="modal-close" onclick="document.getElementById(\'modal-overlay\').classList.remove(\'open\')">&times;</button></div><div class="modal-body" id="modal-body"></div></div>';
    document.body.appendChild(overlay);
  }

  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-body');

  if (type === 'about') {
    title.textContent = 'About Phonon Stage';
    const sys = await api('/system/status');
    if (sys) {
      body.innerHTML = `<dl>
        <dt>Agent Version</dt><dd>v${sys.agent_version}</dd>
        <dt>Hostname</dt><dd>${sys.hostname}</dd>
        <dt>OS</dt><dd>${sys.os_name}</dd>
        <dt>Architecture</dt><dd>${sys.arch}</dd>
        <dt>Kernel</dt><dd>${sys.kernel}</dd>
        <dt>Python</dt><dd>${sys.python_version}</dd>
        <dt>CPU</dt><dd>${sys.cpu_count} cores</dd>
        <dt>Memory</dt><dd>${sys.memory_used_mb} / ${sys.memory_total_mb} MB (${sys.memory_available_mb} MB available)</dd>
        <dt>Processes</dt><dd>${sys.processes.map(p => `${p.name}: ${p.running ? '<span class="sec-ok">running</span>' : '<span class="sec-bad">stopped</span>'} ${p.version}`).join('<br>')}</dd>
      </dl>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:10px;color:var(--text-fade)">
        Phonon — distributed audio router<br>
        <a href="https://github.com/EnigmaEA1337/Phonon" style="color:var(--cyan)" target="_blank">github.com/EnigmaEA1337/Phonon</a>
      </div>`;
    }
  } else if (type === 'security') {
    title.textContent = 'Security Status';
    const sec = await api('/system/security');
    if (sec) {
      body.innerHTML = `<dl>
        <dt>API Binding</dt><dd>${sec.api_bind_address}:${sec.api_port} ${sec.api_bind_address === '0.0.0.0' ? '<span class="sec-bad">WARNING: bound to all interfaces</span>' : '<span class="sec-ok">OK</span>'}</dd>
        <dt>TLS / HTTPS</dt><dd>${sec.tls_enabled ? '<span class="sec-ok">Enabled</span>' : '<span class="sec-warn">Disabled (HTTP only)</span>'}</dd>
        <dt>Firewall</dt><dd>${sec.firewall_active ? '<span class="sec-ok">Active</span>' : '<span class="sec-warn">Inactive</span>'}</dd>
        ${sec.firewall_rules.length ? `<dt>Firewall Rules</dt><dd style="white-space:pre;font-size:9px;max-height:120px;overflow:auto">${sec.firewall_rules.join('\n')}</dd>` : ''}
        <dt>SSH Port</dt><dd>${sec.ssh_port}</dd>
        <dt>SSH Authorized Keys</dt><dd>${sec.ssh_authorized_keys} key(s)</dd>
        <dt>Config File Permissions</dt><dd>${sec.config_file_permissions === '600' ? '<span class="sec-ok">0600 (owner only)</span>' : `<span class="sec-warn">${sec.config_file_permissions}</span>`}</dd>
        <dt>Data Directory Permissions</dt><dd>${sec.data_dir_permissions}</dd>
        <dt>Phonon User Groups</dt><dd>${sec.phonon_user_groups.join(', ') || 'N/A'}</dd>
      </dl>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:10px;color:var(--text-fade)">
        Phase 1: No authentication (lab network trusted)<br>
        Phase 2: Bearer token auth planned<br>
        Phase 3: TLS 1.3 mandatory planned
      </div>`;
    }
  }
  overlay.classList.add('open');
}
</script>
