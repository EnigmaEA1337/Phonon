<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phonon — Standalone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0a0f14; --bg-1: #121822; --bg-2: #1a2230; --bg-3: #243042;
  --border: #2a3850;
  --text: #f0f7fa; --text-mid: #b8cdd9; --text-dim: #8aa3b5; --text-fade: #6a8294;
  --cyan: #06b6d4; --green: #34d399; --pink: #e879f9; --red: #f87171;
  --yellow: #fbbf24; --purple: #a855f7; --blue: #1e40af;
  --t-source: #34d399; --t-output: #e879f9;
  --font-d: 'Barlow Condensed', sans-serif;
  --font-m: 'IBM Plex Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-d); background: var(--bg-0); color: var(--text); min-height: 100vh; }

/* ── Topbar ─────────────────────────────────────────── */
.topbar {
  height: 48px; background: linear-gradient(180deg, #1a2230, #121822);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px;
}
.tb-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: 1.5px; }
.tb-brand .logo { width: 24px; height: 24px; color: var(--cyan); }
.logo polygon, .logo path { stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.logo .atom { fill: currentColor; stroke: none; }
.logo .vertex { fill: currentColor; stroke: none; opacity: 0.55; }
.badge { background: linear-gradient(135deg, var(--cyan), #0e7490); color: var(--bg-0);
  padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
.tb-spacer { flex: 1; }
.tb-info { font-family: var(--font-m); font-size: 10px; color: var(--text-mid); }
.tb-led { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green); }
.tb-clock { font-family: var(--font-m); font-size: 12px; color: var(--text-dim); }

/* ── Layout ─────────────────────────────────────────── */
.container { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.section { background: var(--bg-1); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.section-head { padding: 10px 16px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.section-body { padding: 12px 16px; }

/* ── Cards grid ─────────────────────────────────────── */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.card-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.card-meta { font-family: var(--font-m); font-size: 9px; color: var(--text-dim); line-height: 1.6; }
.card-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; }
.tag-source { background: var(--t-source); color: var(--bg-0); }
.tag-sink { background: var(--t-output); color: var(--bg-0); }
.tag-both { background: var(--cyan); color: var(--bg-0); }

/* ── Patch Bay ──────────────────────────────────────── */
.patch-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
.patch-col { display: flex; flex-direction: column; gap: 6px; }
.patch-col-head { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 1px; padding-bottom: 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.patch-item { padding: 8px 10px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 5px;
  cursor: pointer; font-size: 11px; transition: border-color 0.15s, background 0.15s; }
.patch-item:hover { border-color: var(--cyan); background: var(--bg-3); }
.patch-item.selected { border-color: var(--cyan); background: rgba(6,182,212,0.12);
  box-shadow: 0 0 8px rgba(6,182,212,0.2); }
.patch-arrow { display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text-fade); padding-top: 28px; }
.patch-hint { font-size: 10px; color: var(--text-fade); text-align: center; padding: 8px; }

/* ── Mappings ───────────────────────────────────────── */
.mapping-row { display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid rgba(42,56,80,0.5); }
.mapping-row:last-child { border-bottom: none; }
.mapping-route { flex: 1; font-size: 11px; min-width: 0; }
.mapping-route span { color: var(--text-dim); }
.mapping-control { display: flex; align-items: center; gap: 8px; }
.gain-slider { width: 100px; accent-color: var(--cyan); }
.gain-val { font-family: var(--font-m); font-size: 9px; color: var(--text-mid); width: 44px; text-align: right; }
.btn-mute { width: 28px; height: 22px; border: 1px solid var(--border); background: var(--bg-2);
  color: var(--text-dim); font-size: 9px; font-weight: 700; border-radius: 3px; cursor: pointer; }
.btn-mute.active { background: var(--red); color: var(--bg-0); border-color: var(--red); }
.btn-del { width: 22px; height: 22px; border: 1px solid var(--border); background: var(--bg-2);
  color: var(--text-fade); font-size: 11px; border-radius: 3px; cursor: pointer; }
.btn-del:hover { border-color: var(--red); color: var(--red); }
.mapping-empty { color: var(--text-fade); font-size: 11px; text-align: center; padding: 16px; }

/* ── VU Meter ───────────────────────────────────────── */
.vu-meter { display: flex; gap: 1px; height: 12px; flex: 1; background: var(--bg-0);
  border: 1px solid #050a10; border-radius: 1px; padding: 1px; overflow: hidden; }
.vu-seg { flex: 1; background: var(--bg-0); border-radius: 0.5px; transition: background 60ms linear; }
.vu-seg.on-green { background: #34d399; box-shadow: inset 0 0 1px rgba(255,255,255,0.1); }
.vu-seg.on-yellow { background: #fbbf24; }
.vu-seg.on-red { background: #f87171; }
.vu-label { font-family: var(--font-m); font-size: 8px; color: var(--text-fade); width: 20px; text-align: right; }

/* ── Bluetooth ──────────────────────────────────────── */
.bt-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.bt-device { flex: 1; font-size: 11px; }
.bt-status { font-family: var(--font-m); font-size: 9px; }
.btn { padding: 4px 10px; border: 1px solid var(--border); background: var(--bg-2);
  color: var(--text-mid); font-family: var(--font-d); font-size: 10px; border-radius: 4px;
  cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--bg-3); color: var(--text); }
.btn-primary { background: linear-gradient(135deg, var(--cyan), #0e7490); color: var(--bg-0);
  border-color: transparent; font-weight: 600; }
.btn-primary:hover { filter: brightness(1.1); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Stages ─────────────────────────────────────────── */
.stage-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 11px; }
.stage-led { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

/* ── Status bar ─────────────────────────────────────── */
.statusbar { display: flex; gap: 16px; font-family: var(--font-m); font-size: 9px; color: var(--text-dim);
  padding: 8px 16px; flex-wrap: wrap; }

/* ── Process pill ───────────────────────────────────── */
.proc-pill { display: flex; align-items: center; gap: 6px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: 11px; min-width: 140px; }
.proc-led { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.proc-led.on { background: var(--green); box-shadow: 0 0 4px var(--green); }
.proc-led.off { background: var(--red); box-shadow: 0 0 4px var(--red); }
.proc-name { font-weight: 600; }
.proc-ver { font-family: var(--font-m); font-size: 8px; color: var(--text-dim); }

/* ── Modal ──────────────────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
  display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg-1); border: 1px solid var(--border); border-radius: 10px;
  width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.modal-head { padding: 12px 16px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; border-radius: 10px 10px 0 0; }
.modal-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.modal-close { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
.modal-body { padding: 16px; font-size: 11px; line-height: 1.8; }
.modal-body dt { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; }
.modal-body dd { color: var(--text); margin-left: 0; font-family: var(--font-m); font-size: 10px; }
.sec-ok { color: var(--green); } .sec-warn { color: var(--yellow); } .sec-bad { color: var(--red); }

/* ── Responsive ─────────────────────────────────────── */
@media (max-width: 640px) {
  .patch-grid { grid-template-columns: 1fr; }
  .patch-arrow { display: none; }
  .mapping-control { flex-wrap: wrap; }
  .gain-slider { width: 80px; }
}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="tb-brand">
    <svg class="logo" viewBox="0 0 100 100">
      <polygon points="50,10 86,30 86,70 50,90 14,70 14,30" stroke-width="3"/>
      <path d="M22 50 Q 32 38, 42 50 T 62 50 T 78 50" stroke-width="2.6"/>
      <circle class="atom" cx="50" cy="50" r="3.2"/>
      <circle class="vertex" cx="50" cy="10" r="2"/><circle class="vertex" cx="86" cy="30" r="2"/>
      <circle class="vertex" cx="86" cy="70" r="2"/><circle class="vertex" cx="50" cy="90" r="2"/>
      <circle class="vertex" cx="14" cy="70" r="2"/><circle class="vertex" cx="14" cy="30" r="2"/>
    </svg>
    PHONON
  </div>
  <span class="badge">STANDALONE</span>
  <span class="tb-info" id="stage-id">—</span>
  <div class="tb-spacer"></div>
  <button class="btn" style="font-size:9px;padding:2px 6px" onclick="showModal('about')">About</button>
  <button class="btn" style="font-size:9px;padding:2px 6px" onclick="showModal('security')">Security</button>
  <span class="tb-led"></span>
  <span class="tb-info" id="uptime">—</span>
  <span class="tb-clock" id="clock">--:--:--</span>
</div>

<div class="container">

  <!-- System Processes -->
  <div class="section">
    <div class="section-head">System</div>
    <div class="section-body">
      <div id="sys-processes" style="display:flex;gap:10px;flex-wrap:wrap"></div>
    </div>
  </div>

  <!-- Capabilities -->
  <div class="section">
    <div class="section-head">Audio Devices</div>
    <div class="section-body">
      <div class="card-grid" id="audio-devices"></div>
    </div>
  </div>

  <!-- Patch Bay -->
  <div class="section">
    <div class="section-head">Patch Bay <span style="font-weight:400;color:var(--text-dim);font-size:10px">(max 8 mappings)</span></div>
    <div class="section-body">
      <div class="patch-grid">
        <div class="patch-col">
          <div class="patch-col-head">Sources (output ports)</div>
          <div id="patch-sources"></div>
        </div>
        <div class="patch-arrow">→</div>
        <div class="patch-col">
          <div class="patch-col-head">Sinks (input ports)</div>
          <div id="patch-sinks"></div>
        </div>
      </div>
      <div class="patch-hint" id="patch-hint">Select a source, then a sink to create a mapping</div>
    </div>
  </div>

  <!-- Active Mappings -->
  <div class="section">
    <div class="section-head">Active Mappings <span id="mapping-count" style="font-weight:400;color:var(--text-dim);font-size:10px"></span></div>
    <div class="section-body" id="mappings-list">
      <div class="mapping-empty">No active mappings</div>
    </div>
  </div>

  <!-- Bluetooth -->
  <div class="section">
    <div class="section-head">Bluetooth</div>
    <div class="section-body">
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
        <select id="bt-controller-select" onchange="btSelectController(this.value)"
          style="background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-family:var(--font-m);font-size:10px"></select>
        <button class="btn btn-primary" id="bt-power" onclick="btPower()">Power ON</button>
        <button class="btn" id="bt-scan" onclick="btScan()">Scan</button>
        <span class="tb-info" id="bt-status">—</span>
      </div>
      <div id="bt-paired"></div>
      <div id="bt-scan-results" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- Discovered Stages -->
  <div class="section">
    <div class="section-head">Network Stages</div>
    <div class="section-body" id="stages-list">
      <div style="color:var(--text-fade);font-size:11px">Scanning...</div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="statusbar" id="statusbar">
    <span id="status-ip">—</span>
    <span id="status-mode">—</span>
  </div>
</div>

<script>
const API = window.location.origin;
let state = {
  selectedSource: null, selectedSink: null, nodes: [], ports: [], mappings: [],
  btControllers: [], btSelectedController: null, pairedDevices: [],
};

// ── Clock ────────────────────────────────────────────
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8);
}, 1000);

// ── Fetch helpers ────────────────────────────────────
async function api(path, opts) {
  try {
    const r = await fetch(API + path, opts);
    if (!r.ok) throw new Error(r.statusText);
    if (r.status === 204) return null;
    return await r.json();
  } catch (e) { console.error('API error:', path, e); return null; }
}

// ── Refresh all ──────────────────────────────────────
async function refreshAll() {
  const [health, caps, nodes, ports, mappings, stages] = await Promise.all([
    api('/health'), api('/capabilities'), api('/pipewire/nodes'),
    api('/pipewire/ports'), api('/mappings'), api('/browse/stages?timeout=1'),
  ]);

  if (health) {
    document.getElementById('stage-id').textContent = health.stage_id;
    document.getElementById('uptime').textContent = `uptime ${Math.floor(health.uptime_seconds)}s`;
  }

  if (caps) {
    state.btControllers = caps.bluetooth_controllers || [];
    // Auto-select first controller if none selected
    if (!state.btSelectedController && state.btControllers.length) {
      state.btSelectedController = state.btControllers[0].address;
    }
    renderBtControllerSelect(state.btControllers);
    document.getElementById('status-ip').textContent = `IP: ${caps.stage_id}`;
    document.getElementById('status-mode').textContent = `Mode: ${caps.mode}`;
  }

  if (nodes) { state.nodes = nodes; renderPatchNodes(nodes, ports || []); renderAudioDevices(caps?.audio_devices || [], nodes); }
  if (ports) state.ports = ports;
  if (mappings) { state.mappings = mappings; renderMappings(mappings); }
  if (stages) renderStages(stages);

  // Fetch paired BT devices from ALL controllers, deduplicate by address
  if (state.btControllers.length) {
    const allPaired = [];
    const seenAddrs = new Set();
    for (const ctrl of state.btControllers) {
      const paired = await api(`/bluetooth/devices?controller_address=${ctrl.address}`);
      if (paired) {
        for (const d of paired) {
          if (seenAddrs.has(d.address)) continue;
          seenAddrs.add(d.address);
          d._controller = ctrl.address;
          allPaired.push(d);
        }
      }
    }
    state.pairedDevices = allPaired;
    renderBtPairedDevices(allPaired);
  }
}

// ── Render: Audio Devices ────────────────────────────
function renderAudioDevices(devices, nodes) {
  const el = document.getElementById('audio-devices');

  // ALSA devices
  const alsaCards = (devices || []).map(d => {
    const type = d.playback && d.capture ? 'both' : d.playback ? 'sink' : 'source';
    const tag = type === 'both' ? 'tag-both' : type === 'sink' ? 'tag-sink' : 'tag-source';
    const label = type === 'both' ? 'IN/OUT' : type === 'sink' ? 'OUTPUT' : 'INPUT';
    return `<div class="card">
      <div class="card-title">${d.name} <span class="card-tag ${tag}">${label}</span></div>
      <div class="card-meta">ID: ${d.id} · Driver: ${d.driver} · Card ${d.card_index}</div>
    </div>`;
  });

  // BT devices from PipeWire (bluez5 nodes), deduplicate by bt_address
  const seenBtAddr = new Set();
  const btNodes = (nodes || []).filter(n => {
    if (!n.bt_codec || !n.media_class) return false;
    if (seenBtAddr.has(n.bt_address)) return false;
    seenBtAddr.add(n.bt_address);
    return true;
  });
  // Check if same address has both sink and source nodes
  const btCards = btNodes.map(n => {
    const allForAddr = (nodes || []).filter(nn => nn.bt_address === n.bt_address);
    const hasSink = allForAddr.some(nn => nn.media_class.includes('Sink'));
    const hasSource = allForAddr.some(nn => nn.media_class.includes('Source'));
    const type = hasSink && hasSource ? 'both' : hasSink ? 'sink' : 'source';
    const tag = type === 'both' ? 'tag-both' : type === 'sink' ? 'tag-sink' : 'tag-source';
    const label = type === 'both' ? 'IN/OUT' : type === 'sink' ? 'OUTPUT' : 'INPUT';
    const codec = n.bt_codec.toUpperCase();
    const sr = n.sample_rate ? `${n.sample_rate / 1000}kHz` : '';
    const lat = n.latency_ms ? `${n.latency_ms}ms` : '';
    const meta = [codec, sr, `${n.channels}ch`, lat, n.bt_address].filter(Boolean).join(' · ');
    return `<div class="card" style="border-left:3px solid var(--cyan)">
      <div class="card-title">${n.nick || n.name} <span class="card-tag ${tag}">${label}</span> <span style="font-size:8px;color:var(--cyan)">BT</span></div>
      <div class="card-meta">${meta}</div>
    </div>`;
  });

  const all = [...alsaCards, ...btCards];
  if (!all.length) { el.innerHTML = '<div style="color:var(--text-fade);font-size:11px">No devices detected</div>'; return; }
  el.innerHTML = all.join('');
}

// ── Render: Patch Bay ────────────────────────────────
function nodeInfoBadge(n) {
  if (!n.bt_codec) return '';
  const parts = [n.bt_codec.toUpperCase()];
  if (n.latency_ms) parts.push(n.latency_ms + 'ms');
  if (n.sample_rate) parts.push((n.sample_rate/1000) + 'kHz');
  return `<div style="font-family:var(--font-m);font-size:8px;color:var(--cyan);margin-top:2px">${parts.join(' · ')}</div>`;
}

function renderPatchNodes(nodes, ports) {
  const sources = nodes.filter(n => n.media_class.includes('Source') || n.media_class.includes('Duplex'));
  const sinks = nodes.filter(n => n.media_class.includes('Sink') || n.media_class.includes('Duplex'));

  const srcEl = document.getElementById('patch-sources');
  srcEl.innerHTML = sources.length ? sources.map(n =>
    `<div class="patch-item${state.selectedSource?.id === n.id ? ' selected' : ''}"
      onclick="selectSource(${n.id})" title="${n.media_class}">
      ${n.nick || n.name} <span style="color:var(--text-fade);font-size:9px">#${n.id}</span>
      ${nodeInfoBadge(n)}
    </div>`
  ).join('') : '<div style="color:var(--text-fade);font-size:10px">No sources</div>';

  const sinkEl = document.getElementById('patch-sinks');
  sinkEl.innerHTML = sinks.length ? sinks.map(n =>
    `<div class="patch-item${state.selectedSink?.id === n.id ? ' selected' : ''}"
      onclick="selectSink(${n.id})" title="${n.media_class}">
      ${n.nick || n.name} <span style="color:var(--text-fade);font-size:9px">#${n.id}</span>
      ${nodeInfoBadge(n)}
    </div>`
  ).join('') : '<div style="color:var(--text-fade);font-size:10px">No sinks</div>';
}

function selectSource(nodeId) {
  state.selectedSource = state.nodes.find(n => n.id === nodeId) || null;
  state.selectedSink = null;
  document.getElementById('patch-hint').textContent = `Source: ${state.selectedSource?.nick || state.selectedSource?.name}. Now select a sink.`;
  renderPatchNodes(state.nodes, state.ports);
}

function selectSink(nodeId) {
  if (!state.selectedSource) {
    document.getElementById('patch-hint').textContent = 'Select a source first!';
    return;
  }
  state.selectedSink = state.nodes.find(n => n.id === nodeId) || null;
  renderPatchNodes(state.nodes, state.ports);
  createMapping();
}

async function createMapping() {
  if (!state.selectedSource || !state.selectedSink) return;
  if (state.mappings.length >= 8) {
    document.getElementById('patch-hint').textContent = 'Maximum 8 mappings reached!';
    return;
  }

  const srcPorts = state.ports.filter(p => p.node_id === state.selectedSource.id && p.direction === 'output');
  const sinkPorts = state.ports.filter(p => p.node_id === state.selectedSink.id && p.direction === 'input');

  if (!srcPorts.length || !sinkPorts.length) {
    document.getElementById('patch-hint').textContent = 'No compatible ports found!';
    return;
  }

  await api('/mappings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      source_node_id: state.selectedSource.id,
      source_port_ids: srcPorts.map(p => p.id),
      sink_node_id: state.selectedSink.id,
      sink_port_ids: sinkPorts.map(p => p.id),
      gain_db: 0, pan: 0, mute: false,
    }),
  });

  state.selectedSource = null;
  state.selectedSink = null;
  document.getElementById('patch-hint').textContent = 'Mapping created! Select source then sink for another.';
  await refreshAll();
}

// ── Render: Mappings ─────────────────────────────────
function renderMappings(mappings) {
  const el = document.getElementById('mappings-list');
  document.getElementById('mapping-count').textContent = `(${mappings.length}/8)`;

  if (!mappings.length) { el.innerHTML = '<div class="mapping-empty">No active mappings</div>'; return; }

  el.innerHTML = mappings.map(m => {
    const srcNode = state.nodes.find(n => n.id === m.source_node_id);
    const sinkNode = state.nodes.find(n => n.id === m.sink_node_id);
    const srcName = srcNode?.nick || srcNode?.name || `Node #${m.source_node_id}`;
    const sinkName = sinkNode?.nick || sinkNode?.name || `Node #${m.sink_node_id}`;
    const sinkBt = sinkNode?.bt_codec ? ` <span style="color:var(--cyan);font-size:8px">${sinkNode.bt_codec.toUpperCase()}</span>` : '';
    const sinkLat = sinkNode?.latency_ms ? ` <span style="color:var(--text-fade);font-size:8px">${sinkNode.latency_ms}ms</span>` : '';
    const active = !m.mute && m.link_ids?.length > 0;
    const ledStyle = active ? 'background:var(--green);box-shadow:0 0 4px var(--green)' : 'background:var(--text-fade)';
    const delayVal = (m.delay_ms || 0).toFixed(1);

    // Build 20-segment VU meter HTML
    const segs = 20;
    let vuHtml = '';
    for (let i = 0; i < segs; i++) { vuHtml += `<div class="vu-seg" data-idx="${i}"></div>`; }

    return `<div class="mapping-row" style="flex-direction:column;gap:6px;padding:10px 0" data-mapping-id="${m.id}" data-active="${active}" data-gain="${m.gain_db}">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;${ledStyle}"></span>
        <div class="mapping-route">${srcName} <span style="color:var(--cyan)">→</span> ${sinkName}${sinkBt}${sinkLat}</div>
        <button class="btn-mute${m.mute ? ' active' : ''}" onclick="toggleMute('${m.id}', ${!m.mute})">M</button>
        <button class="btn-del" onclick="deleteMapping('${m.id}')">✕</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding-left:14px">
        <span class="vu-label">L</span>
        <div class="vu-meter" data-ch="L">${vuHtml}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding-left:14px">
        <span class="vu-label">R</span>
        <div class="vu-meter" data-ch="R">${vuHtml}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding-left:14px">
        <span style="font-size:9px;color:var(--text-dim);width:32px">Gain</span>
        <input type="range" class="gain-slider" min="-90" max="12" step="0.5" value="${m.gain_db}"
          oninput="updateGain('${m.id}', this.value)">
        <span class="gain-val" id="gv-${m.id}">${m.gain_db.toFixed(1)} dB</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding-left:14px">
        <span style="font-size:9px;color:var(--text-dim);width:32px">Delay</span>
        <input type="range" class="gain-slider" min="0" max="50" step="0.1" value="${delayVal}"
          oninput="updateDelay('${m.id}', this.value)">
        <span class="gain-val" id="dv-${m.id}">${delayVal} ms</span>
      </div>
    </div>`;
  }).join('');
}

let gainTimeout = {};
function updateGain(id, val) {
  document.getElementById('gv-' + id).textContent = parseFloat(val).toFixed(1) + ' dB';
  clearTimeout(gainTimeout[id]);
  gainTimeout[id] = setTimeout(() => {
    api('/mappings/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ gain_db: parseFloat(val) }) });
  }, 200);
}

let delayTimeout = {};
function updateDelay(id, val) {
  document.getElementById('dv-' + id).textContent = parseFloat(val).toFixed(1) + ' ms';
  clearTimeout(delayTimeout[id]);
  delayTimeout[id] = setTimeout(() => {
    api('/mappings/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ delay_ms: parseFloat(val) }) });
  }, 200);
}

async function toggleMute(id, mute) {
  await api('/mappings/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ mute }) });
  await refreshAll();
}

async function deleteMapping(id) {
  await api('/mappings/' + id, { method: 'DELETE' });
  await refreshAll();
}

// ── Bluetooth ────────────────────────────────────────
function renderBtControllerSelect(controllers) {
  const sel = document.getElementById('bt-controller-select');
  const current = state.btSelectedController;
  sel.innerHTML = controllers.map(c => {
    const selected = c.address === current ? ' selected' : '';
    const pw = c.powered ? ' ON' : ' OFF';
    return `<option value="${c.address}"${selected}>${c.alias || c.name} (${c.address})${pw}</option>`;
  }).join('');
  if (!controllers.length) sel.innerHTML = '<option>No controllers</option>';

  // Update power button text based on selected controller
  const ctrl = controllers.find(c => c.address === current);
  if (ctrl) {
    document.getElementById('bt-power').textContent = ctrl.powered ? 'Power OFF' : 'Power ON';
  }
}

function btSelectController(addr) {
  state.btSelectedController = addr;
  document.getElementById('bt-scan-results').innerHTML = '';
  refreshAll();
}

async function btPower() {
  if (!state.btSelectedController) return;
  const btn = document.getElementById('bt-power');
  const isPowered = btn.textContent.includes('OFF');
  btn.disabled = true;
  document.getElementById('bt-status').textContent = isPowered ? 'Powering off...' : 'Powering on...';
  await api(`/bluetooth/${state.btSelectedController}/power`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ powered: !isPowered }),
  });
  btn.disabled = false;
  await refreshAll();
}

async function btScan() {
  if (!state.btSelectedController) return;
  const btn = document.getElementById('bt-scan');
  btn.disabled = true; btn.textContent = 'Scanning...';
  document.getElementById('bt-status').textContent = 'Scanning (10s)...';

  const devices = await api(`/bluetooth/scan?controller_address=${state.btSelectedController}&timeout=10`);
  btn.disabled = false; btn.textContent = 'Scan';

  if (devices) {
    const pairedAddrs = new Set((state.pairedDevices || []).map(d => d.address));
    const newDevices = devices.filter(d => !pairedAddrs.has(d.address));
    document.getElementById('bt-status').textContent = `Found ${newDevices.length} new devices`;
    renderBtScanResults(newDevices);
  }
}

function renderBtPairedDevices(devices) {
  const el = document.getElementById('bt-paired');
  if (!devices?.length) {
    el.innerHTML = '<div style="color:var(--text-fade);font-size:11px">No paired devices</div>';
    return;
  }
  el.innerHTML = '<div style="font-size:10px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">Paired devices</div>' +
    devices.map(d => {
      const led = d.connected ? 'background:var(--green);box-shadow:0 0 6px var(--green)' : 'background:var(--text-fade)';
      const status = d.connected ? 'connected' : 'paired';
      const statusColor = d.connected ? 'var(--green)' : 'var(--yellow)';
      const actions = d.connected
        ? `<button class="btn" onclick="btDisconnect('${d.address}')">Disconnect</button>`
        : `<button class="btn btn-primary" onclick="btConnect('${d.address}')">Connect</button>`;

      // Match PipeWire node for extended BT info
      const pwNode = state.nodes.find(n => n.bt_address === d.address);
      let infoLine = '';
      if (pwNode && d.connected) {
        const parts = [];
        if (pwNode.bt_codec) parts.push(`<span style="color:var(--cyan);font-weight:600">${pwNode.bt_codec.toUpperCase()}</span>`);
        if (pwNode.sample_rate) parts.push(`${pwNode.sample_rate / 1000}kHz`);
        if (pwNode.channels) parts.push(`${pwNode.channels}ch`);
        if (pwNode.latency_ms) parts.push(`<span style="color:${pwNode.latency_ms > 200 ? 'var(--yellow)' : 'var(--green)'}">${pwNode.latency_ms}ms</span>`);
        if (parts.length) {
          infoLine = `<div style="font-family:var(--font-m);font-size:9px;color:var(--text-dim);margin-top:2px;margin-left:14px">${parts.join(' · ')}</div>`;
        }
      }

      return `<div class="bt-row" style="flex-wrap:wrap">
        <div class="bt-device">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;${led}"></span>
          ${d.alias || d.name}
          <span class="bt-status" style="color:${statusColor}">${status}</span>
        </div>
        <span style="font-family:var(--font-m);font-size:9px;color:var(--text-dim)">${d._controller || '?'} → ${d.address}</span>
        ${actions}
        ${infoLine}
      </div>`;
    }).join('');
}

function renderBtScanResults(devices) {
  const el = document.getElementById('bt-scan-results');
  if (!devices?.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div style="font-size:10px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">Discovered devices</div>' +
    devices.map(d => `<div class="bt-row">
      <div class="bt-device">${d.alias || d.name || d.address}</div>
      <span style="font-family:var(--font-m);font-size:9px;color:var(--text-dim)">${d.address}</span>
      <button class="btn" onclick="btPair('${d.address}')">Pair</button>
    </div>`).join('');
}

async function btPair(addr) {
  document.getElementById('bt-status').textContent = 'Pairing...';
  await api('/bluetooth/pair', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_address:addr})});
  await refreshAll();
}
async function btConnect(addr) {
  document.getElementById('bt-status').textContent = 'Connecting...';
  await api('/bluetooth/connect', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_address:addr})});
  await refreshAll();
}
async function btDisconnect(addr) {
  document.getElementById('bt-status').textContent = 'Disconnecting...';
  await api('/bluetooth/disconnect', { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_address:addr})});
  await refreshAll();
}

// ── Stages ───────────────────────────────────────────
function renderStages(stages) {
  const el = document.getElementById('stages-list');
  if (!stages?.length) { el.innerHTML = '<div style="color:var(--text-fade);font-size:11px">No other Stages on network</div>'; return; }
  el.innerHTML = stages.map(s => `<div class="stage-item">
    <span class="stage-led"></span>
    <span>${s.stage_id}</span>
    <span style="color:var(--text-dim)">${s.host}:${s.port}</span>
    <span class="badge" style="font-size:8px">${s.mode}</span>
  </div>`).join('');
}

// ── VU Meter Animation ───────────────────────────────
// Simulated metering: when a mapping is active (links exist, not muted),
// animate the VU segments based on gain level + random jitter.
// Real peak metering requires a native PipeWire client (v2).
setInterval(() => {
  document.querySelectorAll('.mapping-row[data-mapping-id]').forEach(row => {
    const active = row.dataset.active === 'true';
    const gainDb = parseFloat(row.dataset.gain || '-90');
    const meters = row.querySelectorAll('.vu-meter');

    meters.forEach(meter => {
      const segs = meter.querySelectorAll('.vu-seg');
      const total = segs.length;

      if (!active) {
        segs.forEach(s => { s.className = 'vu-seg'; });
        return;
      }

      // Simulate level: base level from gain, with random fluctuation
      const gainLin = Math.pow(10, gainDb / 20);
      const baseLevel = Math.min(gainLin * 0.7, 0.95);
      const jitter = (Math.random() - 0.5) * 0.15;
      const level = Math.max(0.05, Math.min(1.0, baseLevel + jitter));
      const lit = Math.floor(level * total);

      segs.forEach((s, i) => {
        if (i < lit) {
          if (i >= total * 0.9) s.className = 'vu-seg on-red';
          else if (i >= total * 0.7) s.className = 'vu-seg on-yellow';
          else s.className = 'vu-seg on-green';
        } else {
          s.className = 'vu-seg';
        }
      });
    });
  });
}, 80);

// ── Init ─────────────────────────────────────────────
refreshAll();
setInterval(refreshAll, 3000);

// ── System Status ────────────────────────────────────
async function refreshSystemStatus() {
  const sys = await api('/system/status');
  if (!sys) return;
  const el = document.getElementById('sys-processes');
  el.innerHTML = sys.processes.map(p => {
    const led = p.running ? 'on' : 'off';
    const ver = p.version ? `<span class="proc-ver">${p.version}</span>` : '';
    const det = p.details ? `<span class="proc-ver">${p.details}</span>` : '';
    return `<div class="proc-pill">
      <span class="proc-led ${led}"></span>
      <span class="proc-name">${p.name}</span>${ver}${det}
    </div>`;
  }).join('') +
  `<div class="proc-pill">
    <span class="proc-led on"></span>
    <span class="proc-name">phonon-stage</span>
    <span class="proc-ver">v${sys.agent_version}</span>
    <span class="proc-ver">${sys.memory_used_mb}/${sys.memory_total_mb}MB</span>
  </div>`;
}
refreshSystemStatus();
setInterval(refreshSystemStatus, 10000);

// ── Modals ───────────────────────────────────────────
async function showModal(type) {
  let overlay = document.getElementById('modal-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay';
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('open'); };
    overlay.innerHTML = '<div class="modal"><div class="modal-head"><h2 id="modal-title"></h2><button class="modal-close" onclick="document.getElementById(\'modal-overlay\').classList.remove(\'open\')">&times;</button></div><div class="modal-body" id="modal-body"></div></div>';
    document.body.appendChild(overlay);
  }

  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-body');

  if (type === 'about') {
    title.textContent = 'About Phonon Stage';
    const sys = await api('/system/status');
    if (sys) {
      body.innerHTML = `<dl>
        <dt>Agent Version</dt><dd>v${sys.agent_version}</dd>
        <dt>Hostname</dt><dd>${sys.hostname}</dd>
        <dt>OS</dt><dd>${sys.os_name}</dd>
        <dt>Architecture</dt><dd>${sys.arch}</dd>
        <dt>Kernel</dt><dd>${sys.kernel}</dd>
        <dt>Python</dt><dd>${sys.python_version}</dd>
        <dt>CPU</dt><dd>${sys.cpu_count} cores</dd>
        <dt>Memory</dt><dd>${sys.memory_used_mb} / ${sys.memory_total_mb} MB (${sys.memory_available_mb} MB available)</dd>
        <dt>Processes</dt><dd>${sys.processes.map(p => `${p.name}: ${p.running ? '<span class="sec-ok">running</span>' : '<span class="sec-bad">stopped</span>'} ${p.version}`).join('<br>')}</dd>
      </dl>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:10px;color:var(--text-fade)">
        Phonon — distributed audio router<br>
        <a href="https://github.com/EnigmaEA1337/Phonon" style="color:var(--cyan)" target="_blank">github.com/EnigmaEA1337/Phonon</a>
      </div>`;
    }
  } else if (type === 'security') {
    title.textContent = 'Security Status';
    const sec = await api('/system/security');
    if (sec) {
      body.innerHTML = `<dl>
        <dt>API Binding</dt><dd>${sec.api_bind_address}:${sec.api_port} ${sec.api_bind_address === '0.0.0.0' ? '<span class="sec-bad">WARNING: bound to all interfaces</span>' : '<span class="sec-ok">OK</span>'}</dd>
        <dt>TLS / HTTPS</dt><dd>${sec.tls_enabled ? '<span class="sec-ok">Enabled</span>' : '<span class="sec-warn">Disabled (HTTP only)</span>'}</dd>
        <dt>Firewall</dt><dd>${sec.firewall_active ? '<span class="sec-ok">Active</span>' : '<span class="sec-warn">Inactive</span>'}</dd>
        ${sec.firewall_rules.length ? `<dt>Firewall Rules</dt><dd style="white-space:pre;font-size:9px;max-height:120px;overflow:auto">${sec.firewall_rules.join('\n')}</dd>` : ''}
        <dt>SSH Port</dt><dd>${sec.ssh_port}</dd>
        <dt>SSH Authorized Keys</dt><dd>${sec.ssh_authorized_keys} key(s)</dd>
        <dt>Config File Permissions</dt><dd>${sec.config_file_permissions === '600' ? '<span class="sec-ok">0600 (owner only)</span>' : `<span class="sec-warn">${sec.config_file_permissions}</span>`}</dd>
        <dt>Data Directory Permissions</dt><dd>${sec.data_dir_permissions}</dd>
        <dt>Phonon User Groups</dt><dd>${sec.phonon_user_groups.join(', ') || 'N/A'}</dd>
      </dl>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:10px;color:var(--text-fade)">
        Phase 1: No authentication (lab network trusted)<br>
        Phase 2: Bearer token auth planned<br>
        Phase 3: TLS 1.3 mandatory planned
      </div>`;
    }
  }
  overlay.classList.add('open');
}
</script>
